<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A League of Legends party game: find the Undercover.">
  <meta name="theme-color" content="#010A13">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Undercover League">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Undercover League</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #010A13; }

    /* Shown until Flutter paints its first frame, so the page never flashes
       white and the wait is branded rather than blank. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #010A13;
      opacity: 1;
      transition: opacity 300ms ease;
      z-index: 1;
    }
    #splash.hidden { opacity: 0; }
    #splash-title {
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(20px, 5vw, 34px);
      font-weight: 700;
      letter-spacing: 0.28em;
      /* letter-spacing trails the last glyph; nudge back so it reads centred. */
      text-indent: 0.28em;
      color: #C8AA6E;
      text-align: center;
      line-height: 1.3;
      padding: 0 16px;
    }
    #splash-bar {
      margin-top: 18px;
      width: min(280px, 60vw);
      height: 2px;
      background: rgba(120, 90, 40, 0.35);
      overflow: hidden;
    }
    #splash-bar::after {
      content: "";
      display: block;
      height: 100%;
      width: 0;
      background: #C8AA6E;
      animation: splash-sweep 1.6s ease-in-out infinite;
    }
    @keyframes splash-sweep {
      0%   { width: 0; }
      100% { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
      #splash-bar::after { width: 100%; animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div id="splash-title">UNDERCOVER LEAGUE</div>
    <div id="splash-bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      window.setTimeout(function () { splash.remove(); }, 300);
    });
  </script>

  <!--
    Loads flutter_bootstrap.js ourselves instead of via a plain script tag so
    a new deploy is never served from a browser's stale copy: the bootstrap
    is fetched fresh, its content hash is compared with the last one this
    browser ran, and on a change the legacy service worker, its caches and
    the HTTP-cached core files are all refreshed before the app starts.
  -->
  <script>
    (async function () {
      var KEY = 'undercover.build';
      var CORE = [
        'main.dart.js',
        'main.dart.wasm',
        'main.dart.mjs',
        'flutter.js',
        'manifest.json',
        'assets/AssetManifest.bin',
        'assets/AssetManifest.bin.json',
        'assets/FontManifest.json',
        'assets/fonts/MaterialIcons-Regular.otf'
      ];

      function hash(text) {
        var h = 5381;
        for (var i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
        return (h >>> 0).toString(16);
      }

      function run(source) {
        var script = document.createElement('script');
        script.textContent = source;
        document.body.appendChild(script);
      }

      var previous = null;
      try { previous = localStorage.getItem(KEY); } catch (_) {}

      async function clearCaches() {
        if (!('caches' in window)) return;
        try {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        } catch (_) {}
      }

      // Builds before this one shipped Flutter's caching service worker. It
      // answers fetches from its own cache regardless of fetch options, so
      // while one controls this page nothing below can be trusted: drop it
      // and its caches, then reload once so the next load is uncontrolled.
      if ('serviceWorker' in navigator) {
        try {
          var regs = await navigator.serviceWorker.getRegistrations();
          var controlled = !!navigator.serviceWorker.controller;
          if (regs.length || controlled) {
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
            await clearCaches();
            var reloaded = false;
            try { reloaded = sessionStorage.getItem(KEY + '.reloaded') === '1'; } catch (_) {}
            if (!reloaded) {
              try { sessionStorage.setItem(KEY + '.reloaded', '1'); } catch (_) {}
              location.reload();
              return;
            }
          }
        } catch (_) {}
      }

      var source;
      try {
        // The query string keeps any lingering service worker from matching
        // this request against its cache; the server ignores it.
        source = await fetch('flutter_bootstrap.js?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.text();
        });
      } catch (_) {
        // Server unreachable or blocked: fall back to whatever the browser has.
        var fallback = document.createElement('script');
        fallback.src = 'flutter_bootstrap.js';
        document.body.appendChild(fallback);
        return;
      }

      var current = hash(source);
      if (previous !== current) {
        await clearCaches();
        // `reload` bypasses the HTTP cache and replaces the stored entry, so
        // the requests the bootstrap is about to make hit the new files.
        await Promise.all(CORE.map(function (url) {
          return fetch(url, { cache: 'reload' }).catch(function () {});
        }));
        try { localStorage.setItem(KEY, current); } catch (_) {}
      }
      run(source);
    })();
  </script>
</body>
</html>
