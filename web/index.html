<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A League of Legends party game: find the Undercover.">
  <meta name="theme-color" content="#010A13">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Undercover League">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Undercover League</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #010A13; }

    /* Shown until Flutter paints its first frame, so the page never flashes
       white and the wait is branded rather than blank. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #010A13;
      opacity: 1;
      transition: opacity 300ms ease;
      z-index: 1;
    }
    #splash.hidden { opacity: 0; }
    #splash-title {
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(20px, 5vw, 34px);
      font-weight: 700;
      letter-spacing: 0.28em;
      /* letter-spacing trails the last glyph; nudge back so it reads centred. */
      text-indent: 0.28em;
      color: #C8AA6E;
      text-align: center;
      line-height: 1.3;
      padding: 0 16px;
    }
    #splash-bar {
      margin-top: 18px;
      width: min(280px, 60vw);
      height: 2px;
      background: rgba(120, 90, 40, 0.35);
      overflow: hidden;
    }
    #splash-bar::after {
      content: "";
      display: block;
      height: 100%;
      width: 0;
      background: #C8AA6E;
      animation: splash-sweep 1.6s ease-in-out infinite;
    }
    @keyframes splash-sweep {
      0%   { width: 0; }
      100% { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
      #splash-bar::after { width: 100%; animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div id="splash-title">UNDERCOVER LEAGUE</div>
    <div id="splash-bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      window.setTimeout(function () { splash.remove(); }, 300);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
