# Runs next to the phonetracker stack and is reached only through its Caddy:
#   undercover.jarneclaesen.be { reverse_proxy undercover:8080 }
# Nothing is published on the host.
name: undercover

services:
  undercover:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Curation layer over the Data Dragon import; versioned in the repo and
      # shipped by deploy.sh. Re-read on every catalog refresh (12h) and on
      # start, so `up -d --build` is enough after editing it.
      UNDERCOVER_CATALOG_OVERRIDES: /config/catalog_overrides.json
    volumes:
      - undercover_data:/data
      - ./catalog_overrides.json:/config/catalog_overrides.json:ro
    networks:
      phonetracker_default:
        aliases: [undercover]
    healthcheck:
      # distroless has no curl; the binary probes itself.
      test: ["CMD", "/undercover", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  undercover_data:

networks:
  phonetracker_default:
    external: true
